<button
  type="button"
  class="workspace-sidebar__toggle theme-switcher__button"
  [class.workspace-sidebar__toggle--collapsed]="navigation.sidebarCollapsed()"
  [attr.aria-label]="navigation.sidebarCollapsed() ? templateText.message1 : templateText.message2"
  (click)="toggleSidebar()"
>
  <span class="material-symbols-outlined">menu</span>
</button>

<aside
  class="workspace-sidebar"
  [class.workspace-sidebar--rail]="rail()"
  [class.workspace-sidebar--card]="!rail()"
  [class.workspace-sidebar--collapsed]="navigation.sidebarCollapsed()"
  aria-label="LivingWiki workspace navigation"
  i18n-aria-label
>
  <a routerLink="/home" class="workspace-sidebar__brand" aria-label="LivingWiki home" i18n-aria-label>
    <img src="/assets/image/lucky-paper-crane.png" alt="" />
    <span><b>Living</b>Wiki</span>
  </a>

  <nav class="workspace-sidebar__nav" aria-label="Workspace navigation" i18n-aria-label>
    @for (item of navigation.primaryItems(); track item.key) {
      <a
        [routerLink]="item.route"
        [fragment]="item.fragment"
        class="workspace-sidebar__item"
        [class.is-active]="navigation.isActive(item.key)"
        [class.workspace-sidebar__item--trove]="item.key === 'trove'"
        [class.workspace-sidebar__item--off-grids]="item.key === 'off-grids'"
        [attr.aria-current]="navigation.isActive(item.key) ? 'page' : null"
      >
        @if (item.iconImageUrl) {
          <img [src]="item.iconImageUrl" alt="" class="workspace-sidebar__icon-image" />
        } @else {
          <span class="material-symbols-outlined">{{ item.icon }}</span>
        }
        <span>{{ item.label }}</span>
      </a>
    }

    <button type="button" class="workspace-sidebar__item" (click)="openAbout($event)">
      <span class="material-symbols-outlined">info</span>
      <span i18n>About</span>
    </button>

    <button
      type="button"
      class="workspace-sidebar__item workspace-sidebar__more"
      [class.is-active]="navigation.moreActive()"
      aria-haspopup="dialog"
      (click)="openMore($event)"
    >
      <span class="material-symbols-outlined">apps</span>
      <span i18n>More</span>
      <span class="material-symbols-outlined workspace-sidebar__more-arrow">arrow_outward</span>
    </button>
  </nav>
</aside>
